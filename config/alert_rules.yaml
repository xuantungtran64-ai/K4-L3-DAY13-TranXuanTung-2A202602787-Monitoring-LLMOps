alerts:
  - name: high_p95_latency
    severity: high
    condition: "p95(latency_ms) > 3000ms"
    duration: "5m"
    type: symptom-based
    channel: "#alerts-llm"
    owner: "oncall-team"
    runbook: docs/alerts.md#alert-1
  - name: high_error_rate
    severity: critical
    condition: "error_rate > 2%"
    duration: "3m"
    type: symptom-based
    channel: "#alerts-llm"
    owner: "oncall-team"
    runbook: docs/alerts.md#alert-2
  - name: low_retrieval_success
    severity: warning
    condition: "retrieval_success < 90%"
    duration: "10m"
    type: symptom-based
    channel: "#alerts-search"
    owner: "search-team"
    runbook: docs/alerts.md#alert-3
