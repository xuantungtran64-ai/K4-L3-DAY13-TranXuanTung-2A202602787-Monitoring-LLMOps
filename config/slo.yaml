service: day13-l3b-monitoring-llmops-lab
primary_slo:
  name: fast_successful_requests
  window: 28d
  sli:
    good_event: 'event == "response_sent" and latency_ms <= 3000'
    total_event: 'event == "request_received"'
  target_percent: 99.5
  error_budget_percent: 0.5
  note: SLO được đặt ở mức 99.5%, nghĩa là error budget là 0.5%. Giả sử với baseline 500 requests mỗi ngày (khoảng 14,000 requests/28 ngày), hệ thống được phép có tối đa 70 requests gặp lỗi hoặc chạy chậm (latency > 3000ms) trong chu kỳ 28 ngày trước khi vi phạm SLO.
guardrails:
  error_rate_pct_max: 2
  daily_cost_usd_max: 2.5
  quality_score_avg_min: 0.75
  retrieval_success_rate_pct_min: 90
